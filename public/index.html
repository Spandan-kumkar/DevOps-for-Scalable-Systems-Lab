<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #f0f4fd 0%, #e2e8f0 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 48px 16px;
      color: #1e293b;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      padding: 32px 28px;
    }

    header {
      margin-bottom: 24px;
    }

    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #4f46e5;
      background: #eef2ff;
      padding: 4px 8px;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
    }

    .stats {
      font-size: 13px;
      color: #64748b;
      margin-top: 4px;
    }

    .input-area {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 14px;
      font-size: 15px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      outline: none;
      transition: all 0.2s ease;
      background: #f8fafc;
    }

    input[type="text"]:focus {
      background: #fff;
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    button.btn-add {
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 600;
      background: #4f46e5;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    button.btn-add:hover {
      background: #4338ca;
    }

    button.btn-add:active {
      transform: scale(0.98);
    }

    ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      transition: all 0.2s ease;
    }

    li:hover {
      border-color: #cbd5e1;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .task-content {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      cursor: pointer;
    }

    .task-checkbox {
      width: 18px;
      height: 18px;
      accent-color: #4f46e5;
      cursor: pointer;
    }

    li span.text {
      font-size: 15px;
      color: #334155;
      line-height: 1.4;
      word-break: break-word;
    }

    li.completed span.text {
      text-decoration: line-through;
      color: #94a3b8;
    }

    li button.btn-delete {
      background: transparent;
      color: #94a3b8;
      border: none;
      padding: 6px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s, background 0.15s;
    }

    li button.btn-delete:hover {
      color: #ef4444;
      background: #fee2e2;
    }

    #message {
      text-align: center;
      color: #94a3b8;
      font-size: 14px;
      padding: 32px 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <span class="badge">DevOps Project</span>
      <h1>Student Task Manager</h1>
      <p class="stats" id="taskCount">0 tasks total</p>
    </header>

    <div class="input-area">
      <input type="text" id="taskInput" placeholder="What needs to be done?" autocomplete="off" />
      <button class="btn-add" onclick="addTask()">Add Task</button>
    </div>

    <ul id="taskList"></ul>
    <p id="message">No tasks yet. Add your first task above!</p>
  </div>

  <script>
    window.onload = loadTasks;

    async function loadTasks() {
      try {
        const res = await fetch('/tasks');
        const tasks = await res.json();
        renderTasks(tasks);
      } catch (err) {
        console.error("Failed to load tasks", err);
      }
    }

    async function addTask() {
      const input = document.getElementById('taskInput');
      const taskText = input.value.trim();
      if (!taskText) return;

      const res = await fetch('/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ task: taskText })
      });

      if (res.ok) {
        input.value = '';
        loadTasks();
      }
    }

    async function deleteTask(id) {
      await fetch(`/tasks/${id}`, { method: 'DELETE' });
      loadTasks();
    }

    function toggleTaskStatus(liElement) {
      liElement.classList.toggle('completed');
    }

    function renderTasks(tasks) {
      const list = document.getElementById('taskList');
      const message = document.getElementById('message');
      const countLabel = document.getElementById('taskCount');
      list.innerHTML = '';

      countLabel.textContent = `${tasks.length} task${tasks.length === 1 ? '' : 's'} total`;

      if (tasks.length === 0) {
        message.style.display = 'block';
        return;
      }

      message.style.display = 'none';
      tasks.forEach(task => {
        const li = document.createElement('li');

        const taskContent = document.createElement('div');
        taskContent.className = 'task-content';
        taskContent.onclick = () => toggleTaskStatus(li);

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'task-checkbox';

        const span = document.createElement('span');
        span.className = 'text';
        span.textContent = task.text;

        taskContent.appendChild(checkbox);
        taskContent.appendChild(span);

        const delBtn = document.createElement('button');
        delBtn.className = 'btn-delete';
        delBtn.innerHTML = '&#10005;';
        delBtn.title = 'Delete task';
        delBtn.onclick = (e) => {
          e.stopPropagation();
          deleteTask(task.id);
        };

        li.appendChild(taskContent);
        li.appendChild(delBtn);
        list.appendChild(li);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('taskInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') addTask();
      });
    });
  </script>

</body>
</html>
